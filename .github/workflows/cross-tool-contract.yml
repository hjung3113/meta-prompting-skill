name: Cross-tool contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Release candidate
        run: node tests/acceptance/validate-release-candidate.mjs
      - name: Field Evaluation
        run: node tests/acceptance/validate-field-evaluation.mjs
